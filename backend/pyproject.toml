[project]
name = "fantasy-draft-lab-backend"
version = "0.1.0"
description = "FastAPI draft engine for Fantasy Draft Lab"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false
